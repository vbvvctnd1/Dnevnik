<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест экспорта Telegram</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:30px;text-align:center}
button{font-size:18px;padding:15px 22px;border:0;border-radius:12px}
#status{margin-top:20px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>Тест экспорта</h2>
<p>Открой эту страницу внутри Telegram и нажми кнопку.</p>
<button id="share">Тест «Поделиться»</button>
<div id="status"></div>
<script>
document.getElementById('share').onclick = async () => {
  const status = document.getElementById('status');
  const data = JSON.stringify({type:"gym-backup-test",message:"Тестовый файл"}, null, 2);
  const file = new File([data], "test-backup.json", {type:"application/json"});
  try {
    if (!navigator.share) {
      status.textContent = "❌ navigator.share недоступен.";
      return;
    }
    if (navigator.canShare && !navigator.canShare({files:[file]})) {
      status.textContent = "⚠️ Share есть, но передачу файла WebView не разрешает.";
      return;
    }
    await navigator.share({
      title:"Резервная копия",
      text:"Тестовый файл резервной копии",
      files:[file]
    });
    status.textContent = "✅ Меню «Поделиться» вызвано.";
  } catch(e) {
    status.textContent = "ℹ️ Отменено или не поддерживается.\n" + (e?.message || e);
  }
};
</script>
</body>
</html>
